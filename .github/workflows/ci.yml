name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spicedb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Run SpiceDB migrations
        run: |
          docker run --rm --network host \
            authzed/spicedb migrate head \
            --datastore-engine postgres \
            --datastore-conn-uri "postgres://postgres:postgres@localhost:5432/spicedb?sslmode=disable"

      - name: Start SpiceDB
        run: |
          docker run -d --name spicedb \
            --network host \
            authzed/spicedb serve \
            --grpc-preshared-key testkey \
            --datastore-engine postgres \
            --datastore-conn-uri "postgres://postgres:postgres@localhost:5432/spicedb?sslmode=disable"

      - name: Wait for SpiceDB
        run: |
          for i in $(seq 1 30); do
            docker logs spicedb 2>&1 | grep -q "grpc server started serving" && break
            sleep 1
          done
          sleep 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction

      - name: Run tests
        env:
          SPICEDB_ENDPOINT: localhost:50051
          SPICEDB_TOKEN: testkey
          SPICEDB_INSECURE: "true"
        run: poetry run pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check django_spicedb/
