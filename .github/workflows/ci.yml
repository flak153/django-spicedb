name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start SpiceDB
        run: |
          docker run -d --name spicedb \
            -p 50051:50051 \
            authzed/spicedb serve \
            --grpc-preshared-key testkey \
            --datastore-engine memory

      - name: Wait for SpiceDB
        run: |
          for i in $(seq 1 30); do
            if grpc_health_probe -addr=localhost:50051 2>/dev/null; then
              echo "SpiceDB is ready"
              exit 0
            fi
            sleep 1
          done
          echo "SpiceDB ready (timeout ok for memory engine)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction

      - name: Run tests
        env:
          SPICEDB_ENDPOINT: localhost:50051
          SPICEDB_TOKEN: testkey
          SPICEDB_INSECURE: "true"
        run: poetry run pytest -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check django_spicedb/
